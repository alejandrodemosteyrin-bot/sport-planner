[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sport-planner"
version = "0.1.0"
description = "Five-day surf / kite / MTB planner for the Conil de la Frontera area, delivered daily by Telegram."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
sport-planner = "sport_planner.cli:main"

[tool.setuptools.packages.find]
include = ["sport_planner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real external services; skipped unless SPORT_PLANNER_LIVE=1"]
